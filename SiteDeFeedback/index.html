<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel= "stylesheet" href= "style.css">
    <title>Algum Feedback?</title>
    <!-- Fonte Love Ya Like a Sister-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!--Fonte Slackey-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Eater&family=Love+Ya+Like+A+Sister&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Slackey&display=swap" rel="stylesheet">
    <!-- Fonte Comic Relief -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">


</head>
<body>
    <header>
      
      
        <div class="feedbacko">
          <div class="feedbacko-titulo">
            <h1>Algum Feedback?</h1>
          </div>
        
    </header>   
        <p> Encontrou algum bug? Tem alguma crítica? Algo no jogo que precisa ser melhorado?<br>Preencha nos quadros abaixo para que a nossa equipe possa ler.</p>

          <div class="box">
              <form action="">
                <fieldset>
                  <legend><b>CAMPO DE CRÍTICAS</b></legend>
                  <div class="inputNameBox">
                  <input type="text" name="nome" id="nome" class="inputUser" required>
                  <label for="nome">Escreva o seu nome</label>
                  </div>
                  <div class="inputEmailBox">
                    <input type="text" name="e-mail" id="e-mail" class="inputUser" required>
                    <label for="comment">Seu e-mail</label>
                  </div>
                  <div class="inputCommentBox">
                    <input type="text" name="comment" id="comment" class="inputUser" required>
                    <label for="comment">Comentário</label>
                  </div>
                  <input type="submit" name="submit" id="submit">
                </fieldset>
              </form>
          </div>
          <div class="feed-image">
            <img src="Feedback-imagens/BobEsponja.png">
          </div>
          
          <div class="voltar">
            <a href="http://127.0.0.1:5500/index.html">
             <button>Voltar para o início</button>
            </a>
          </div>
        
      
</body>
</html>
